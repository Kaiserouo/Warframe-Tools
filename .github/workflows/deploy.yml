# ref. https://vite.dev/guide/static-deploy.html#github-pages
# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ['main']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Try warframe endpoint
        run: |
          curl -A "Mozilla/5.0" "https://content.warframe.com/PublicExport/index_en.txt.lzma" | unlzma

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: './src/web/frontend/package-lock.json'
      - name: Install dependencies
        working-directory: ./src/web/frontend
        run: npm ci
      - name: Build
        working-directory: ./src/web/frontend
        run: npm run build:github

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: pip install -r ./requirements.txt
      - name: Install xvfb
        run: apt install -y xvfb
      - name: Generate API data for frontend
        run: python -m src.web.backend.gen_api_cache ./src/web/frontend/build_github_page

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: './src/web/frontend/build_github_page'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5